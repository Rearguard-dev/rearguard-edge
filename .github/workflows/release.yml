name: release

# The edge release supports one production target: Linux x86_64. Keeping one
# artifact prevents architecture-specific builds from drifting from the robot
# computers used in deployment and validation.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  BUF_VERSION: '1.72.0'
  ROS_APT_SOURCE_VERSION: '1.3.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev libyaml-cpp-dev nlohmann-json3-dev libssl-dev libturbojpeg0-dev libsqlite3-dev libcurl4-openssl-dev

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install pinned ROS 2 apt source
        run: |
          ubuntu_codename="$(. /etc/os-release && printf '%s' "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")"
          ros_source_deb="${RUNNER_TEMP}/ros2-apt-source.deb"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.${ubuntu_codename}_all.deb" \
            --output "${ros_source_deb}"
          sudo apt-get install -y "${ros_source_deb}"
          sudo apt-get update

      - name: Install ROS 2 discovery dependencies
        run: >-
          sudo apt-get install -y
          ros-jazzy-rclcpp ros-jazzy-rclcpp-action
          ros-jazzy-rosbag2-cpp
          ros-jazzy-rosbag2-storage-mcap
          ros-jazzy-control-msgs
          ros-jazzy-controller-manager-msgs
          ros-jazzy-sensor-msgs ros-jazzy-std-msgs
          ros-jazzy-trajectory-msgs ros-jazzy-geometry-msgs
          ros-jazzy-rosgraph-msgs ros-jazzy-rmw-cyclonedds-cpp

      - name: Generate C++ schemas
        working-directory: schemas
        run: >-
          buf generate
          --template '{"version":"v2","plugins":[{"protoc_builtin":"cpp","out":"gen/cpp"}]}'

      - name: Isolation check
        run: ./scripts/isolation_check.sh

      - name: Build, test, package
        run: |
          source /opt/ros/jazzy/setup.bash
          build_log="${RUNNER_TEMP}/rearguard-release-build.log"
          if ! HARNESS_WITH_ROS2=ON ./scripts/build_artifact.sh "${GITHUB_REF_NAME#v}" >"${build_log}" 2>&1; then
            cat "${build_log}"
            grep -E 'FAILED:|fatal error:|error:|CMake Error|tests failed|ninja: build stopped' "${build_log}" |
              tail -20 |
              while IFS= read -r failure; do
                failure="${failure//'%'/'%25'}"
                failure="${failure//$'\r'/'%0D'}"
                failure="${failure//$'\n'/'%0A'}"
                echo "::error title=ROS-enabled release build failed::${failure}"
              done
            exit 1
          fi
          cat "${build_log}"

      - name: Verify packaged edge runtime contract
        run: |
          source /opt/ros/jazzy/setup.bash
          ./build-release/rearguard scan setup --domain-min 0 --domain-max 0 --settle-ms 1 --parallelism 1 --out "${RUNNER_TEMP}/scan.json"
          artifact="dist/harness-kernel-${GITHUB_REF_NAME#v}-x86_64-linux-gnu.tar.gz"
          test -f "${artifact}"
          package_root="harness-kernel-${GITHUB_REF_NAME#v}"
          # grep -q can close a pipeline early, making tar fail with SIGPIPE
          # under Actions' pipefail. Validate/list the archive once, then search.
          package_listing="${RUNNER_TEMP}/harness-package-listing.txt"
          tar -tzf "${artifact}" >"${package_listing}"
          grep -Fxq "${package_root}/bin/rearguard" "${package_listing}"
          grep -Fxq "${package_root}/bin/harness_critic" "${package_listing}"
          grep -Fxq "${package_root}/lib/libharness_kernel.so" "${package_listing}"
          grep -Fxq "${package_root}/lib/libthreshold_critic.so" "${package_listing}"
          grep -Fxq "${package_root}/lib/libstall_critic.so" "${package_listing}"
          grep -Fxq "${package_root}/share/harness/runtime/edge-runtime.json" "${package_listing}"
          grep -Fxq "${package_root}/share/harness/install/install_runtime_deps.sh" "${package_listing}"
          if grep -q '/share/harness/observation/' "${package_listing}"; then
            echo "::error::release must not package embodiment-specific observation presets"
            exit 1
          fi
          extracted="${RUNNER_TEMP}/rearguard-release"
          mkdir -p "${extracted}"
          tar -xzf "${artifact}" -C "${extracted}"
          installed="${extracted}/${package_root}"
          "${installed}/share/harness/install/install_runtime_deps.sh" --check
          test -f "${installed}/share/harness/install/install.sh"
          "${installed}/bin/rearguard" update --help
          test "$("${installed}/bin/rearguard" --version)" = "rearguard ${GITHUB_REF_NAME#v}"
          "${installed}/bin/rearguard" abi
          critic_usage="${RUNNER_TEMP}/harness-critic-usage.txt"
          if "${installed}/bin/harness_critic" >"${critic_usage}" 2>&1; then
            echo "::error::harness_critic unexpectedly accepted an empty command"
            exit 1
          fi
          grep -Fq 'harness_critic <inspect|seal-engines|score|replay|encode|benchmark>' "${critic_usage}"
          for executable in rearguard harness_critic; do
            dependencies="${RUNNER_TEMP}/${executable}-dependencies.txt"
            ldd "${installed}/bin/${executable}" >"${dependencies}"
            if grep -q 'not found' "${dependencies}"; then
              echo "::error::packaged ${executable} has unresolved shared libraries"
              exit 1
            fi
          done
          grep -q '"critic_runtime"[[:space:]]*:[[:space:]]*"native_cpp"' "${installed}/share/harness/runtime/edge-runtime.json"
          grep -q '"realtime_gate"[[:space:]]*:[[:space:]]*"libharness_kernel_c_abi"' "${installed}/share/harness/runtime/edge-runtime.json"
          grep -q '"intervention_transport"[[:space:]]*:[[:space:]]*"native_ros2_controller_manager_follow_joint_trajectory"' "${installed}/share/harness/runtime/edge-runtime.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
